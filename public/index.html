<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>askUserQuestion Web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link href="/app.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand">💬 <span class="brand-text">askUserQuestion</span></span>
      <span class="badge" data-conn data-i18n="connecting">Connecting…</span>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-sm btn-ghost" data-lang-switch type="button" data-i18n="langSwitch" data-i18n-label="langSwitchLabel">中文</button>
      <button class="btn btn-sm btn-outline" data-enable-notify type="button" data-i18n="enableNotify">🔔 Enable alerts</button>
    </div>
  </header>

  <main class="auq-main">
    <section class="auq-empty" data-empty>
      <div class="auq-empty-icon">⏳</div>
      <p class="muted" data-i18n="waiting">Waiting for Claude to ask…</p>
      <p class="hint" data-i18n="waitingHint"></p>
    </section>
    <div class="auq-asks" data-asks></div>
  </main>

  <template data-tpl-ask>
    <form class="card auq-ask" novalidate>
      <div class="ask-meta">
        <span data-ask-id></span>
        <time data-ask-time></time>
      </div>
      <div class="auq-questions" data-questions></div>
      <p class="error-text hidden" data-error></p>
      <div class="ask-actions">
        <span class="hint auq-hint" data-i18n="submitHint"></span>
        <button class="btn btn-ghost" type="button" data-cancel data-i18n="skip"></button>
        <button class="btn btn-primary" type="submit" data-submit disabled data-i18n="submit"></button>
      </div>
    </form>
  </template>

  <template data-tpl-question>
    <fieldset class="auq-question">
      <legend class="question-head">
        <span class="badge badge-outline" data-q-header></span>
        <span class="hint" data-q-mode></span>
      </legend>
      <h2 class="question-text" data-q-text></h2>
      <div class="auq-body">
        <div class="auq-options" data-options></div>
        <aside class="auq-preview hidden" data-preview>
          <div class="hint preview-label" data-preview-label></div>
          <pre class="auq-preview-box" data-preview-box></pre>
        </aside>
      </div>
      <details class="notes">
        <summary data-i18n="addNote"></summary>
        <textarea class="field" rows="2" maxlength="2000" data-i18n-placeholder="notesPlaceholder" data-notes></textarea>
      </details>
    </fieldset>
  </template>

  <template data-tpl-option>
    <label class="auq-option">
      <input class="choice" data-input>
      <span class="option-text">
        <span class="option-label" data-opt-label></span>
        <span class="option-desc" data-opt-desc></span>
      </span>
    </label>
  </template>

  <template data-tpl-done>
    <div class="auq-done">
      <span data-done-icon></span>
      <div class="option-text">
        <span class="option-label" data-done-title></span>
        <ul class="done-list" data-done-list></ul>
      </div>
    </div>
  </template>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
